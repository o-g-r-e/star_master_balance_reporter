<html>
<head>
    <title>Наряд-задание № ###-###</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>
<body>
<h1>Наряд-задание № <span contenteditable="true">###-###</span></h1>
<h4>Дата: <span contenteditable="true">04.04.2023</span></h4>
<h4>Деталь: <span contenteditable="true">UTE-345 5/3 4.3</span></h4>
<table id="work-table" class="table">
    <thead>
    <tr>
        <th scope="col">#</th>
        <th scope="col">Операция</th>
        <th scope="col">Рабочий</th>
        <th scope="col">Норма выработки шт. 11.25 ч/см</th>
        <th scope="col">Норма мин./шт.</th>
        <th scope="col">Изготовлено</th>
        <th scope="col">Калькуляция времени</th>
    </tr>
    </thead>
    <tbody id="table-body">
    </tbody>
    <tfoot>
        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <th>Всего изготовлено: <span id="total-items"></span></th>
            <th>Всего времени: <span id="total-time"></span></th>
        </tr>
    </tfoot>
</table>
<button id="add-row" type="button" class="btn btn-light">Добавить строку</button>
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
            </div>
        </div>
    </div>
</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script
        src="https://code.jquery.com/jquery-3.7.0.min.js"
        integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g="
        crossorigin="anonymous"></script>
<script>

    let workers = ["Wade", "Dave", "Seth", "Ivan", "Riley"];
    let workDayMinutes = 675;
    let operations = [
        {name: "Battere", workNorm: 100, itemPerMinutes: workDayMinutes/100},
        {name: "Lerytud", workNorm: 350, itemPerMinutes: workDayMinutes/350},
        {name: "Renerty", workNorm: 480, itemPerMinutes: workDayMinutes/480},
        {name: "Vertiny", workNorm: 500, itemPerMinutes: workDayMinutes/500},
        {name: "Menarize", workNorm: 600, itemPerMinutes: workDayMinutes/600}
    ];
    let selectedTd;
    let rows = 0;

    function addRow() {

        let tr = document.createElement("tr");
        let rowTh = document.createElement("th");
        rowTh.innerText = ++rows;
        let operationTd = document.createElement("td");
        operationTd.innerText = "Выберите операцию";
        let workerTd = document.createElement("td");
        workerTd.innerText = "Выберите рабочего";
        let opWorkNormTd = document.createElement("td");
        opWorkNormTd.innerText = "0";
        let opItemsPerMinutesTd = document.createElement("td");
        opItemsPerMinutesTd.innerText = "0";
        let itemsTd = document.createElement("td");
        itemsTd.classList.add("op-items");
        itemsTd.setAttribute("contenteditable", "true");
        let timeTd = document.createElement("td");
        timeTd.classList.add("op-calc-time");

        tr.append(rowTh)
        tr.append(operationTd)
        tr.append(workerTd)
        tr.append(opWorkNormTd)
        tr.append(opItemsPerMinutesTd)
        tr.append(itemsTd)
        tr.append(timeTd)

        $(workerTd).click(function (e) {
            selectedTd = e.target;
            $(".modal-body").first().html("");
            workers.forEach(function (value, index) {
                $(".modal-body").first().append(`<div><a class="modal-select" data-bs-dismiss="modal" href="#">${value}</a></div>`);
                $(".modal-select").click(function (e) {
                    workerTd.innerText = e.target.innerText;
                });
            })
            $("#exampleModalLabel").text("Выберите рабочего");
            $('#exampleModal').modal('show');
        });

        $(operationTd).click(function (e) {
            selectedTd = e.target;
            $(".modal-body").first().html("");
            operations.forEach(function (operation, index) {
                $(".modal-body").first().append(`<div><a work-norm="${operation.workNorm}" items-per-minutes="${operation.itemPerMinutes.toFixed(1)}" class="modal-select" data-bs-dismiss="modal" href="#">${operation.name}</a></div>`);
                $(".modal-select").click(function (e) {
                    operationTd.innerText = e.target.innerText;
                    $(opWorkNormTd).text(e.target.getAttribute("work-norm"));
                    $(opItemsPerMinutesTd).text(e.target.getAttribute("items-per-minutes"));

                    if(isNumeric(itemsTd.innerText)) {
                        computeWorkTime();
                    }
                });
            })
            $("#exampleModalLabel").text("Выберите операцию");
            $('#exampleModal').modal('show');
        });

        function computeWorkTime() {
            let itemsPerMinutes = parseFloat(opItemsPerMinutesTd.innerText);
            let items = parseInt(itemsTd.innerText);
            if(isNaN(items)) items = 0;
            $(timeTd).text((itemsPerMinutes*items).toFixed(1));
            computeTotals();
        }

        itemsTd.addEventListener("input", function(e){
            if(isNumeric(itemsTd.innerText)) {
                computeWorkTime();
            }
        })

        $("#table-body").append(tr);
    }
    addRow();

    $("#add-row").click(function() {
        addRow();
    });

    function isNumeric(value) {
        return /^[\-\+]?\d+\.?\d*$/.test(value);
    }

    function computeTotals() {
        let totalItems = 0;
        let totalTime = 0;
        $("#table-body tr").each(function(index) {
            let items = $(this).find(".op-items").text();
            let time = $(this).find(".op-calc-time").text();
            if(isNumeric(items)) totalItems += parseInt(items);
            if(isNumeric(time)) totalTime += parseFloat(time);
        });
        totalTime = totalTime.toFixed(1);
        let timeBalance = totalTime - workDayMinutes;
        timeBalance = timeBalance.toFixed(1);
        $("#total-items").text(totalItems);
        $("#total-time").text(totalTime+' ('+(timeBalance>0?'+'+timeBalance:timeBalance)+')');
    }

</script>
</html>
