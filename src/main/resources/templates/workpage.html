<html>
<head>
    <title>Рабочие</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .edit-action-b, .del-action-b {
            display:none;
        }
    </style>
</head>
<body>
    <div class="container-md pb-5">
        <ul th:replace="~{fragments/navigation :: navigationFragment}"></ul>
        <div class="row border-bottom pt-2 pb-2">
            <div class="col-12 text-center h1">[[${worker.fullName}]]</div>
        </div>
        <th:block th:each="item, itemStat : ${workerEntryes}">
            <div class="row border-bottom pt-1 pb-1">
                <div class="col-12 text-center h2" th:text="${item.key.name}"></div>
            </div>
            <th:block th:each="operation, operationStat : ${item.value}">
                <div class="row border-bottom pt-1 pb-1">
                    <div class="col-12 text-center h3" th:text="${operation.key.name}"></div>
                </div>
                <th:block th:each="entry : ${operation.value}">
                    <form class="row mt-3">
                        <input type="hidden" class="entry-id-input" th:value="${entry.id}">
                        <input type="hidden" class="worker-id-input" th:value="${worker.id}" disabled>
                        <input type="hidden" class="item-id-input" th:value="${item.key.id}" disabled>
                        <input type="hidden" class="operation-id-input" th:value="${operation.key.id}" disabled>
                        <label class="col-2 col-sm-2 col-md-auto col-form-label text-end">№ Наряда</label>
                        <div class="col-2 col-sm-2 col-md-2">
                            <input type="text" class="form-control wt-number-input" th:value="${entry.workTaskNumber}" disabled>
                        </div>

                        <label class="col-2 col-sm-2 col-md-auto col-form-label text-end">Кол-во</label>
                        <div class="col-2 col-sm-2 col-md-2">
                            <input type="number" class="form-control items-count-input" th:value="${entry.operationItemsCount}" disabled>
                        </div>

                        <div class="col-auto base-action-b">
                            <button type="button" class="btn btn-light bi bi-pencil fs-5 base-action-edit"></button>
                        </div>
                        <div class="col-auto base-action-b">
                            <button type="button" class="btn btn-light bi bi-trash fs-5 base-action-del"></button>
                        </div>

                        <div class="col-auto edit-action-b">
                            <button type="button" class="btn btn-primary edit-action-save">
                                <span class="spinner-border spinner-border-sm spinner" role="status" aria-hidden="true" style="display: none"></span>&nbsp;Save
                            </button>
                        </div>
                        <div class="col-auto edit-action-b">
                            <button type="button" class="btn btn-secondary edit-action-cancel">Cancel</button>
                        </div>

                        <div class="col-auto del-action-b">
                            <button type="button" class="btn btn-danger del-action-accept">Delete</button>
                        </div>
                        <div class="col-auto del-action-b">
                            <button type="button" class="btn btn-secondary del-action-cancel">Cancel</button>
                        </div>
                    </form>
                </th:block>
                <form class="entry-form row mt-5 mb-5">
                    <input type="hidden" class="worker-id-input" th:value="${worker.id}">
                    <input type="hidden" class="item-id-input" th:value="${item.key.id}">
                    <input type="hidden" class="operation-id-input" th:value="${operation.key.id}">

                    <label class="col-2 col-sm-2 col-md-auto col-form-label text-end">№ Наряда</label>
                    <div class="col-2 col-sm-2">
                        <input type="text" class="task-number-input form-control">
                    </div>
                    <label class="col-2 col-sm-2 col-md-auto col-form-label text-end">Кол-во</label>
                    <div class="col-2 col-sm-2">
                        <input type="text" class="items-count-input form-control">
                    </div>
                    <div class="col-2 col-sm-2">
                        <button class="btn btn-light send-entry">Добавить</button>
                    </div>
                </form>
            </th:block>
        </th:block>
        <a th:href="${'/workpage/worker/' + worker.id + '/select_operation'}" role="button" class="col-auto btn btn-primary mt-3" id="add-operation">Добавить операцию</a>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script
        src="https://code.jquery.com/jquery-3.7.0.min.js"
        integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g="
        crossorigin="anonymous"></script>

<script>

    $(".base-action-b .base-action-edit").click(function(){
        let form = $(this).parent().parent();

        $(form).find(".base-action-b").hide();
        $(form).find(".edit-action-b").show();

        $(form).find(".wt-number-input, .items-count-input").prop("disabled", false);

        $(form).find(".edit-action-b .edit-action-cancel").click(function(){
            $(form).find(".base-action-b").show();
            $(form).find(".edit-action-b").hide();
            $(form).find(".wt-number-input, .items-count-input").prop("disabled", true);
        });

        $(form).find(".edit-action-b .edit-action-save").click(function(){
            $(this).find(".spinner").show();
            $(this).prop("disabled", true);
            $(form).find(".edit-action-b .edit-action-cancel").prop("disabled", true);

            sendJson('/workpage/save_entry', {
                id: $(form).find(".entry-id-input").val(),
                workerId: $(form).find(".worker-id-input").val(),
                itemId: $(form).find(".item-id-input").val(),
                operationId: $(form).find(".operation-id-input").val(),
                taskNumber: $(form).find(".wt-number-input").val(),
                itemsCount: $(form).find(".items-count-input").val()
            });
        });
    });

    $(".base-action-b .base-action-del").click(function(){
        let form = $(this).parent().parent();

        $(form).find(".base-action-b").hide();
        $(form).find(".del-action-b").show();

        $(form).find(".del-action-b .del-action-cancel").click(function(){
            $(form).find(".base-action-b").show();
            $(form).find(".del-action-b").hide();
        });

        $(form).find(".del-action-b .del-action-accept").click(function(){
            sendJson('/workpage/delete_entry', {
                id: $(form).find(".entry-id-input").val()
            });
        });
    });

    $(".entry-form .send-entry").click(function(e){
        e.preventDefault();
        let form = $(this).parent().parent();

        $(form).find(".task-number-input, .items-count-input").removeClass("is-invalid");

        let taskNumber = $(form).find(".task-number-input").val().trim();
        let itemsCount = $(form).find(".items-count-input").val().trim();
        let valid = true;
        if(taskNumber == "") {
            $(form).find(".task-number-input").addClass("is-invalid");
            valid = false;
        }

        if(itemsCount == "") {
            $(form).find(".items-count-input").addClass("is-invalid");
            valid = false;
        }

        if(!valid) {
            return;
        }

        sendJson('/workpage/add_entry', {
            workerId: $(form).find(".worker-id-input").val(),
            itemId: $(form).find(".item-id-input").val(),
            operationId: $(form).find(".operation-id-input").val(),
            taskNumber: $(form).find(".task-number-input").val(),
            itemsCount: $(form).find(".items-count-input").val()
        });
    });

    function sendJson(url, data) {
        $.ajax({
            url: url,
            method: 'POST',
            dataType: 'JSON',
            data: JSON.stringify(data),
            headers: {
                "Accept": "application/json",
                "Content-Type": "application/json"
            },
            success: function(data){
                location.reload();
            },
            error: function(data){
                console.log("error response");
            },
            complete: function(){
            }
        });
    }
</script>
</html>
