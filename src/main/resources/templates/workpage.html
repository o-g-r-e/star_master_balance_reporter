<html>
<head>
    <title>Рабочие</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .edit-action-b, .del-action-b {
            display:none;
        }
    </style>
</head>
<body>
    <div class="container-md pb-5">
        <ul th:replace="~{fragments/navigation :: navigationFragment}"></ul>
        <div class="row border-bottom pt-2 pb-2">
            <div class="col-12 text-center h1">[[${worker.fullName}]]</div>
        </div>
        <th:block th:each="item, itemStat : ${workerEntryes}">
            <div class="row border-bottom pt-1 pb-1">
                <div class="col-12 text-center h2" th:text="${item.key.name}"></div>
            </div>
            <th:block th:each="operation, operationStat : ${item.value}">
                <div class="row border-bottom pt-1 pb-1">
                    <div class="col-12 text-center h3" th:text="${operation.key.name}"></div>
                </div>
                <form class="row mt-3">
                    <!--<div class="col-4 col-md-2">
                        <label class="form-label">№ Наряда</label>
                    </div>-->

                    <div class="col-4 col-md-2">
                        <label class="form-label">Кол-во</label>
                    </div>
                </form>
                <th:block th:each="entry : ${operation.value}">
                    <form class="row mt-3 entry-row">
                        <input type="hidden" class="entry-id-input" th:value="${entry.id}">
                        <input type="hidden" class="worker-id-input" th:value="${worker.id}">
                        <input type="hidden" class="item-id-input" th:value="${item.key.id}">
                        <input type="hidden" class="operation-id-input" th:value="${operation.key.id}">

                        <div class="col-4 col-md-2 d-none">
                            <span class="wt-number-input" th:text="${entry.workTaskNumber}"></span>
                        </div>

                        <div class="col-4 col-md-2">
                            <span class="wt-items-count-input" th:text="${entry.operationItemsCount}"></span>
                        </div>

                        <div class="col-4 col-md-auto">
                            <button class="btn btn-light edit-entry">Ред.</button>
                        </div>
                    </form>
                </th:block>
                <form class="entry-form mt-5 mb-5">
                    <input type="hidden" class="worker-id-input" th:value="${worker.id}">
                    <input type="hidden" class="item-id-input" th:value="${item.key.id}">
                    <input type="hidden" class="operation-id-input" th:value="${operation.key.id}">

                    <div class="row">
                        <!--<div class="col-4 col-md-2">
                            <label class="form-label">№ Наряда</label>
                        </div>-->
                        <div class="col-4 col-md-2">
                            <label class="form-label">Кол-во</label>
                        </div>
                    </div>


                    <div class="row">
                        <div class="col-4 col-md-2 d-none">
                            <input type="text" value="0000" class="task-number-input form-control">
                        </div>

                        <div class="col-4 col-md-2">
                            <input type="text" class="items-count-input form-control">
                        </div>
                        <div class="col-4 col-md-auto">
                            <button class="btn btn-light send-entry">Добавить</button>
                        </div>
                    </div>
                </form>
            </th:block>
        </th:block>
        <a th:href="${'/workpage/worker/' + worker.id + '/select_operation'}" role="button" class="col-auto btn btn-primary mt-3" id="add-operation">Добавить операцию</a>

        <div class="modal fade" id="editEntryModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Редактирование</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form novalidate>
                            <input type="hidden" class="entry-id-input">
                            <input type="hidden" class="worker-id-input">
                            <input type="hidden" class="item-id-input">
                            <input type="hidden" class="operation-id-input">
                            <div class="d-none">
                                <label for="editTakNumberInput" class="form-label">№ Наряда</label>
                                <input type="text" class="form-control" id="editTakNumberInput" placeholder="">
                            </div>
                            <div class="mt-3">
                                <label for="editItemsCountInput" class="form-label">Кол-во</label>
                                <input type="number" class="form-control" id="editItemsCountInput" placeholder="">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button id="saveEntry" type="button" class="btn btn-primary">Сохранить</button>
                        <button id="deleteEntry" type="button" class="btn btn-danger">Удалить запись</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script
        src="https://code.jquery.com/jquery-3.7.0.min.js"
        integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g="
        crossorigin="anonymous"></script>

<script>

    $(".edit-entry").click(function(e){
        e.preventDefault();
        $("#editEntryModal").modal("show");

        let entryForm = $(this).parent().parent();

        $("#editEntryModal #editTakNumberInput").val(entryForm.find(".wt-number-input").text());
        $("#editEntryModal #editItemsCountInput").val(entryForm.find(".wt-items-count-input").text());

        $("#editEntryModal .entry-id-input").val(entryForm.find(".entry-id-input").val());
        $("#editEntryModal .worker-id-input").val(entryForm.find(".worker-id-input").val());
        $("#editEntryModal .item-id-input").val(entryForm.find(".item-id-input").val());
        $("#editEntryModal .operation-id-input").val(entryForm.find(".operation-id-input").val());
    });

    $("#editEntryModal #saveEntry").click(function(){
        sendJson('/workpage/save_entry', {
            id: $("#editEntryModal .entry-id-input").val(),
            workerId: $("#editEntryModal .worker-id-input").val(),
            itemId: $("#editEntryModal .item-id-input").val(),
            operationId: $("#editEntryModal .operation-id-input").val(),
            taskNumber: $("#editEntryModal #editTakNumberInput").val(),
            itemsCount: $("#editEntryModal #editItemsCountInput").val()
        });
    });

    $("#editEntryModal #deleteEntry").click(function(){
        sendJson('/workpage/delete_entry', {
            id: $("#editEntryModal .entry-id-input").val()
        });
    });

    $(".entry-form .send-entry").click(function(e){
        e.preventDefault();
        let form = $(this).parent().parent().parent();

        $(form).find(".task-number-input, .items-count-input").removeClass("is-invalid");

        let taskNumber = $(form).find(".task-number-input").val().trim();
        let itemsCount = $(form).find(".items-count-input").val().trim();
        let valid = true;
        if(taskNumber == "") {
            $(form).find(".task-number-input").addClass("is-invalid");
            valid = false;
        }

        if(itemsCount == "") {
            $(form).find(".items-count-input").addClass("is-invalid");
            valid = false;
        }

        if(!valid) {
            return;
        }

        sendJson('/workpage/add_entry', {
            workerId: $(form).find(".worker-id-input").val(),
            itemId: $(form).find(".item-id-input").val(),
            operationId: $(form).find(".operation-id-input").val(),
            taskNumber: $(form).find(".task-number-input").val(),
            itemsCount: $(form).find(".items-count-input").val()
        });
    });

    function sendJson(url, data) {
        $.ajax({
            url: url,
            method: 'POST',
            dataType: 'JSON',
            data: JSON.stringify(data),
            headers: {
                "Accept": "application/json",
                "Content-Type": "application/json"
            },
            success: function(data){
                location.reload();
            },
            error: function(data){
                console.log("error response");
            },
            complete: function(){
            }
        });
    }
</script>
</html>
