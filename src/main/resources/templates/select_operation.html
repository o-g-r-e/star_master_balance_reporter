<html>
<head>
    <title>Выбор операции</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
<div class="container">
    <ul th:replace="~{fragments/navigation :: navigationFragment}"></ul>
    <div class="accordion mt-3" id="acc">
        <div class="accordion-item" th:each="item : ${itemsList}">
            <h2 class="accordion-header" th:id="${'accHead-' + item.id}">
                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" th:data-bs-target="${'#collapse' + item.id}" aria-expanded="true" th:aria-controls="${'collapse' + item.id}">
                    [[${item.name}]]
                </button>
            </h2>
            <div th:id="${'collapse' + item.id}" class="accordion-collapse collapse" th:aria-labelledby="${'accHead-' + item.id}" data-bs-parent="#acc">
                <div class="accordion-body" style="padding: 0">
                    <div class="list-group">
                        <a href="#" th:itemId="${item.id}" th:opId="${op.id}" class="list-group-item list-group-item-action op-list-item" th:each="op : ${item.operations}" th:text="${op.name}"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script
        src="https://code.jquery.com/jquery-3.7.0.min.js"
        integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g="
        crossorigin="anonymous"></script>
<script>
    $(".op-list-item").click(function(e){
        e.preventDefault();

        $.ajax({
            url: '/workpage/add_entry',
            method: 'POST',
            dataType: 'JSON',
            data: JSON.stringify({
                workerId: [[${worker.id}]],
                itemId: $(this).attr("itemId"),
                operationId: $(this).attr("opId"),
                taskNumber: "0",
                itemsCount: 0
            }),
            headers: {
                "Accept": "application/json",
                "Content-Type": "application/json"
            },
            success: function(data){
                location.replace('/workpage/worker/' + [[${worker.id}]]);
            },
            error: function(data){
                console.log("error response");
            },
            complete: function(){
            }
        });
    });
</script>
</html>
